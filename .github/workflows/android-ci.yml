name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "${SDKMANAGER}" ]; then
            "${SDKMANAGER}" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          "${ANDROID_HOME}/platform-tools/adb" version > /dev/null 2>&1 || true

      - name: Toolchain diagnostics
        run: |
          java -version
          ./gradlew --version


      # 签名策略（严禁引入随机性）：
      #   1) 若仓库提供了 Secrets，用 Secrets 里的 keystore；
      #   2) 否则一律沿用 AGP 内置的 Android 标准 debug keystore —— 它是**跨机器确定性**的，
      #      因此每一轮 CI 打出的包签名完全一致，升级时可以直接覆盖安装，不需要卸载重装。
      # 历史坑：早期版本在无 Secrets 时用 keytool 现生成临时 keystore，
      # 导致每次构建签名都不同 → 覆盖安装报“应用未安装”。
      - name: Prepare signing material
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KS_B64}" ]; then
            echo "${KS_B64}" | base64 -d > release.jks
            KS_PASS="${KS_PASS:-zhiwei123}"
            KEY_ALIAS="${KEY_ALIAS:-zhiwei}"
            KEY_PASS="${KEY_PASS:-$KS_PASS}"
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${KS_PASS}" "${KEY_ALIAS}" "${KEY_PASS}" > keystore.properties
            echo "签名：使用仓库 Secrets 提供的固定 keystore"
          else
            echo "签名：使用 AGP 内置 Android 标准 debug keystore（确定性，跨构建一致）"
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK info
        if: always()
        run: |
          echo "== 产物 =="
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhiwei-manager-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload build reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            **/lint-results*.html
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: zhiwei-manager-apk
          path: apk

      - name: Show files
        run: find apk -type f -exec ls -lh {} \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/**/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false