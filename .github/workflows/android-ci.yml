name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug + release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Ensure Android SDK components
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "${SDKMANAGER}" ]; then
            "${SDKMANAGER}" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          "${ANDROID_HOME}/platform-tools/adb" version > /dev/null 2>&1 || true

      - name: Toolchain diagnostics
        run: |
          java -version
          ./gradlew --version

      # 签名策略（严禁引入随机性）：
      #   1) 用仓库 Secrets 里的固定 keystore 生成 keystore.properties，release 签名恒定；
      #   2) 若缺少 Secrets：tag 构建直接 fail（拒绝产出签名不固定的正式包），
      #      分支构建仅告警并退回 debug 签名。
      # 历史坑（2026-11-06 实测坐实）：AGP「内置 Android 标准 debug keystore」**并非跨构建确定性**——
      # CI 每次全新 runner，~/.android/debug.keystore 不存在 → 现场随机生成密钥对，
      # 导致 v1.3.0 / v1.4.0 签名证书完全不同，覆盖安装报「应用未安装 / 软件包与现有软件包存在冲突」。
      - name: Prepare signing material
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KS_B64}" ]; then
            echo "${KS_B64}" | base64 -d > release.jks
            KS_PASS="${KS_PASS:-zhiwei123}"
            KEY_ALIAS="${KEY_ALIAS:-zhiwei}"
            KEY_PASS="${KEY_PASS:-$KS_PASS}"
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "${KS_PASS}" "${KEY_ALIAS}" "${KEY_PASS}" > keystore.properties
            echo "签名：使用仓库 Secrets 提供的固定 keystore（alias=${KEY_ALIAS}）"
          else
            echo "::error::未配置 KEYSTORE_BASE64，release 签名将不固定，禁止发布。"
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              echo "tag 构建必须固定签名 → 终止。"
              exit 1
            fi
            echo "非 tag 构建，继续（签名不稳定，产物仅供调试，切勿分发）。"
          fi


      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon
      - name: Collect APK info
        if: always()
        run: |
          echo "== 产物 =="
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      # 硬校验：正式包必须由固定 keystore 签发，指纹不符直接失败（防止再次出现「每次构建换签名」）
      - name: Verify release signing certificate
        if: always()
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "release APK 未产出，跳过指纹校验"
            exit 0
          fi
          BT="$(ls -d "${ANDROID_HOME}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          echo "build-tools: ${BT}"
          "${BT}apksigner" verify --print-certs --verbose "$APK" || true
          FP="$("${BT}apksigner" verify --print-certs "$APK" 2>/dev/null \
                | grep -i 'certificate SHA-256 digest' | head -1 \
                | sed 's/.*digest: *//' | tr -d ':' | tr 'A-Z' 'a-z')"
          # 期望值**直接从构建用的 keystore 现算**，避免人手抄错；没有 keystore 时才用兜底常量。
          if [ -f keystore.properties ] && [ -f release.jks ]; then
            KSP="$(sed -n 's/^storePassword=//p' keystore.properties)"
            EXPECT="$(keytool -list -v -keystore release.jks -storepass "${KSP}" 2>/dev/null \
                      | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-Z' 'a-z')"
          fi
          EXPECT="${EXPECT:-085348ded53a57b77c5149a33aef74def9fffcc7bf17fc9e1878930f89a6ab8a}"
          echo "实际签名指纹: ${FP}"
          echo "期望签名指纹: ${EXPECT}"
          if [ -z "${FP}" ]; then
            echo "::error::读不到 APK 签名指纹"
            exit 1
          fi
          if [ "${FP}" != "${EXPECT}" ]; then
            echo "::error::正式包签名指纹与固定 keystore 不一致 —— 覆盖安装会失败，禁止发布"
            exit 1
          fi
          echo "✅ 正式包签名指纹一致，可覆盖安装"


      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zhiwei-manager-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload build reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
            **/lint-results*.html
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # 必须 checkout：更新报告正文取自仓库根的 RELEASE_NOTES.md（body_path 是工作区相对路径）
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: zhiwei-manager-apk
          path: apk

      - name: Show files
        run: find apk -type f -exec ls -lh {} \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/**/*.apk
          # 更新报告直接取仓库根的 RELEASE_NOTES.md（changelog 手写、可控，不靠提交信息自动拼）
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: false